<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c8e6c9" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="leafG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <linearGradient id="scannerG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#11998e" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e7d34" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="24" fill="url(#bgGrad)"/>

  <!-- Scanning Frame / Tech Grid -->
  <g transform="translate(150, 60)" filter="url(#shadow)">
    <!-- Main Device / Frame -->
    <rect x="0" y="0" width="300" height="320" rx="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
    
    <!-- Camera Viewport -->
    <rect x="20" y="20" width="260" height="230" rx="14" fill="#f8fdf9" stroke="#c8e6c9" stroke-width="1.5"/>

    <!-- Scanning grid lines -->
    <line x1="20" y1="90" x2="280" y2="90" stroke="#81c784" stroke-width="0.8" stroke-dasharray="4,4"/>
    <line x1="20" y1="160" x2="280" y2="160" stroke="#81c784" stroke-width="0.8" stroke-dasharray="4,4"/>
    <line x1="100" y1="20" x2="100" y2="250" stroke="#81c784" stroke-width="0.8" stroke-dasharray="4,4"/>
    <line x1="180" y1="20" x2="180" y2="250" stroke="#81c784" stroke-width="0.8" stroke-dasharray="4,4"/>

    <!-- Central Leaf Illustration -->
    <g transform="translate(150, 135)">
      <!-- Leaf body -->
      <path d="M 0 -85 C 55 -65 75 15 0 75 C -75 15 -55 -65 0 -85 Z" fill="url(#leafG)"/>
      <path d="M 0 -75 L 0 65" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path d="M 0 -45 L 30 -20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 -15 L -35 10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 15 L 28 35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 45 L -20 60" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      
      <!-- AI Bounding Target -->
      <circle cx="15" cy="-10" r="18" fill="none" stroke="#f39c12" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="15" cy="-10" r="3" fill="#e67e22"/>
    </g>

    <!-- Scan Beam -->
    <polygon points="20,110 280,110 280,170 20,170" fill="url(#scannerG)"/>
    <line x1="20" y1="170" x2="280" y2="170" stroke="#2ecc71" stroke-width="3"/>

    <!-- Frame Corner Markers -->
    <path d="M 30 40 L 30 30 L 40 30" fill="none" stroke="#28a745" stroke-width="3"/>
    <path d="M 270 40 L 270 30 L 260 30" fill="none" stroke="#28a745" stroke-width="3"/>
    <path d="M 30 230 L 30 240 L 40 240" fill="none" stroke="#28a745" stroke-width="3"/>
    <path d="M 270 230 L 270 240 L 260 240" fill="none" stroke="#28a745" stroke-width="3"/>

    <!-- Status pill below viewport -->
    <rect x="35" y="265" width="230" height="38" rx="10" fill="#e8f5e9"/>
    <circle cx="55" cy="284" r="6" fill="#28a745"/>
    <text x="70" y="288" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1b4332">AI Status: Healthy Leaf (98.4%)</text>
  </g>

  <!-- Floating Badge Left -->
  <g transform="translate(60, 180)" filter="url(#shadow)">
    <rect width="130" height="64" rx="12" fill="#ffffff"/>
    <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">⚡</text>
    <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1b4332">&lt; 0.5s</text>
    <text x="42" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6c757d">Inference Time</text>
  </g>

  <!-- Floating Badge Right -->
  <g transform="translate(420, 220)" filter="url(#shadow)">
    <rect width="130" height="64" rx="12" fill="#ffffff"/>
    <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">🌱</text>
    <text x="42" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#1b4332">38 Classes</text>
    <text x="42" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#6c757d">PlantVillage</text>
  </g>
</svg>
